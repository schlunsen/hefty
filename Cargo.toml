[package]
name = "hefty"
version = "1.2.0"
edition = "2021"
description = "A fast CLI disk usage analyzer — find the hefty files hogging your disk space"
license = "MIT"
repository = "https://github.com/schlunsen/hefty"
homepage = "https://github.com/schlunsen/hefty"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
globset = "0.4"
bytesize = "1"
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
trash = "5"
blake3 = "1"
opener = { version = "0.7", features = ["reveal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
